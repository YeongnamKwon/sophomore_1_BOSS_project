<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Code Judge Program Login</title>
        <style>

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: #000;
                color: #fff;
                font-family: sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .box {
                display: flex;
                flex-direction: column;
                gap: 14px;
                width: 300px;
            }
            .header-group {
                text-align: center;
                margin-bottom: 10px;
            }

            .header-group h2 {
                margin: 0;
                font-size: 24px;
                font-weight: bold;
            }

            .header-group p {
                margin: 8px 0 0;
                font-size: 13px;
                color: #888;
            }

            input {
                padding: 12px;
                background: #111;
                border: 1px solid #444;
                border-radius: 6px;
                color: #fff;
                font-size: 14px;
                outline: none;
                width: 100%;
            }

            input:focus {
                border-color: #fff;
            }

            button {
                padding: 12px;
                background: #fff;
                color: #000;
                border: none;
                border-radius: 6px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                width: 100%;
                transition: background 0.2s;
            }

            button:hover {
                background: #ddd;
            }

            .error {
                color: #f66;
                font-size: 12px;
                text-align: center;
                display: none;
            }
        </style>
    </head>

    <body>
        <div class="box">
            <!-- 3.요청하신 상단 문구 추가 -->
             <div class="header-group">
                <h2>Code Judge Program</h2>
                <p>학번을 입력하세요.</p>
             </div>
            <input type="text" id="id" placeholder="학번" />
            <div class="error" id="error">학번이 맞지 않습니다.</div>
            <button onelick="login()">로그인</button>
        </div>

        <script>
            function login() {
                const id = document.getElementById('id').value.trin();
                const error = document.getElementById('error');

                if (!id) {
                    error.style.display = 'block';
                    return;
                }

                error.style.display = 'none';
                // TODO : 로그인 성공 하면 이동할 페이지임.
                window.location.href = 'problems.html';
            }

            document.addEventListener('keydown', e => {
                if (e.key === 'Enter') login();
            });
        </script>
    </body>
</html>
