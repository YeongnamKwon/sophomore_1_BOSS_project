<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Code Judge Program Login</title>
        <style>
            body {
                margin: 0;
                background: #000;
                color: #fff;
                font-family: sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .box {
                display: flex;
                flex-direction: column;
                gap: 14px;
                width: 280px;
            }

            h2 {
                text-align: center;
                margin-bottom: 8px;
                font-size: 20px;
            }

            input {
                padding: 10px 12px;
                background: #111;
                border: 1px solid #444;
                border-radius: 6px;
                color: #fff;
                font-size: 14px;
                outline: none;
                width: 100%;
            }

            input:focus {
                border-color: #888;
            }

            button {
                padding: 10px;
                background: #fff;
                color: #000;
                border: none;
                border-radius: 6px;
                font-size: 14px;
                font-weight: bold;
                cursor: pointer;
            }

            button:hover {
                background: #ddd;
            }

            .error {
                color: #f66;
                font-size: 12px;
                text-align: center;
                display: none;
            }
        </style>
    </head>

    
</html>
