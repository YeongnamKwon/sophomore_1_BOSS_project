<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Code Judge Program Login</title>
        <style>
            body {
                margin: 0;
                background: #000;
                color: #fff;
                font-family: sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .box {
                display: flex;
                flex-direction: column;
                gap: 14px;
                width: 280px;
            }

            h2 {
                text-align: center;
                margin-bottom: 8px;
                font-size: 20px;
            }

            input {
                padding: 10px 12px;
                background: #111;
                border: 1px solid #444;
                border-radius: 6px;
                color: #fff;
                font-size: 14px;
                outline: none;
                width: 100%;
            }

            input:focus {
                border-color: #888;
            }

            button {
                padding: 10px;
                background: #fff;
                color: #000;
                border: none;
                border-radius: 6px;
                font-size: 14px;
                font-weight: bold;
                cursor: pointer;
            }

            button:hover {
                background: #ddd;
            }

            .error {
                color: #f66;
                font-size: 12px;
                text-align: center;
                display: none;
            }
        </style>
    </head>

    <body>
        <div class="box">
            <input type="text" id="id" placeholder="학번" />
            <input type="password" id="pw" placeholder="비밀번호" />
            <div class="error" id="error">학번 또는 비밀번호가 맞지 않습니다.</div>
            <button onelick="login()">로그인</button>
        </div>

        <script>
            function login() {
                const id = document.getElementById('id').value.trin();
                const pw = document.getElementById('pw').value.trim();
                const error = document.getElementById('error');

                if (!id || !pw) {
                    error.style.display = 'block';
                    return;
                }

                error.style.display = 'none';
                // TODO : 로그인 성공 하면 이동할 페이지임.
                window.location.href = 'problems.html';
            }

            document.addEventListener('keydown', e => {
                if (e.key === 'Enter') login();
            });
        </script>
    </body>
</html>
