<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>제출</title>
</head>
<body>
  <h1>코드 제출 페이지</h1>
  <p id="info"></p>

  <script>
    const studentId = localStorage.getItem('currentStudentId');
    const problem = localStorage.getItem('selectedProblem');

    document.getElementById('info').textContent =
      `학번: ${studentId}, 선택 문제: ${problem}`;
  </script>
</body>
</html>
