<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>코드 제출</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .user-info {
            width: 900px;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            background-color: #f7f7f7;
        }

        textarea {
            width: 900px;
            height: 400px;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        button {
            margin-top: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }

        #resultBox {
            width: 900px;
            height: 300px;
            overflow-y: auto;
            border: 1px solid #333;
            background-color: #111;
            color: #eee;
            padding: 10px;
            font-family: Consolas, monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h2>코드 제출</h2>

<label>문제 선택</label>
<select id="problemType">
    <option value="A_PLUS_B">A+B</option>
    <option value="MAX_VALUE">최댓값</option>
</select>

<div class="user-info">
    사용자 식별 번호:
    <strong th:text="${userId}">userId</strong>
</div>

<textarea id="code" placeholder="여기에 Java 코드를 입력하세요."></textarea>
<br>
<button onclick="submitCode()">제출</button>

<h2>채점 결과</h2>
<pre id="resultBox"></pre>

<script>
let eventSource = null;

function submitCode() {
    const code = document.getElementById("code").value;
    const resultBox = document.getElementById("resultBox");

    if (code.trim() === "") {
        alert("코드를 입력하세요.");
        return;
    }

    if (eventSource !== null) {
        eventSource.close();
    }

    resultBox.textContent = "채점 요청 중...\n";

    const encodedCode = encodeURIComponent(code);
    const problemType = document.getElementById("problemType").value;
    eventSource = new EventSource(
        "/submit-stream?code=" + encodedCode + "&problemType=" + encodeURIComponent(problemType)
    );
    eventSource.onmessage = function(event) {
        let message = event.data;

        if (message.startsWith("[CURRENT]")) {
            message = message.replace("[CURRENT]", "");
        }

        if (message.startsWith("[CLEAR_CURRENT]")) {
            return;
        }

        resultBox.textContent += message + "\n";
        resultBox.scrollTop = resultBox.scrollHeight;
    };

    eventSource.onerror = function() {
        if (eventSource !== null) {
            eventSource.close();
            eventSource = null;
        }
    };
}
</script>

</body>
</html>
