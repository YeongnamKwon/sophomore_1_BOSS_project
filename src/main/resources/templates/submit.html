<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>코드 제출</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        textarea {
            width: 900px;
            height: 400px;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        button {
            margin-top: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }

        #resultBox {
            width: 900px;
            height: 300px;
            overflow-y: auto;
            border: 1px solid #333;
            background-color: #111;
            color: #eee;
            padding: 10px;
            font-family: Consolas, monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h2>코드 제출</h2>

<textarea id="code"></textarea>
<br>
<button onclick="submitCode()">제출</button>

<h2>채점 결과</h2>
<pre id="resultBox"></pre>

<script>
let eventSource = null;

function submitCode() {
    const code = document.getElementById("code").value;
    const resultBox = document.getElementById("resultBox");

    if (eventSource !== null) {
        eventSource.close();
    }

    resultBox.textContent = "채점 요청 중...\n";

    const encodedCode = encodeURIComponent(code);
    eventSource = new EventSource("/submit-stream?code=" + encodedCode);

    eventSource.onmessage = function(event) {
        let message = event.data;

        if (message.startsWith("[CURRENT]")) {
            message = message.replace("[CURRENT]", "");
        }

        if (message.startsWith("[CLEAR_CURRENT]")) {
            return;
        }

        resultBox.textContent += message + "\n";

        resultBox.scrollTop = resultBox.scrollHeight;
    };

    eventSource.onerror = function() {
        if (eventSource !== null) {
            eventSource.close();
            eventSource = null;
        }
    };
}
</script>

</body>
</html>
