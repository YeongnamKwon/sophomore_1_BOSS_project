<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Code Judge - Practice</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --boj-blue: #007bff;
            --text-main: #eeeeee;
            --text-sub: rgba(255, 255, 255, 0.5);
            --editor-bg: #1e1e1e;
            --result-bg: rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }

        body {
            margin: 0; padding: 20px;
            background: radial-gradient(circle at center, #333333, #000000);
            min-height: 100vh; color: var(--text-main);
            overflow: hidden; /* 전체 스크롤 방지 */
        }

        .container {
            max-width: 1500px; margin: 0 auto;
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 20px; height: calc(100vh - 40px);
        }

        /* 왼쪽: 문제 영역 */
        .problem-section {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 30px; overflow-y: auto;
        }

        /* 오른쪽: 에디터 및 결과 영역 */
        .editor-section {
            display: flex; flex-direction: column; gap: 20px;
        }

        .editor-container {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 25px; flex: 2; display: flex; flex-direction: column;
        }

        .result-container {
            background: var(--result-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; flex: 1;
            display: flex; flex-direction: column;
        }

        /* UI 요소 */
        h1.title { font-size: 24px; margin: 0 0 20px 0; }
        .info-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; font-size: 13px; text-align: center; }
        .info-table th { color: var(--text-sub); border-bottom: 1px solid var(--glass-border); padding: 10px; }
        .info-table td { padding: 10px; border-bottom: 1px solid var(--glass-border); }

        h3 { font-size: 18px; border-bottom: 2px solid var(--boj-blue); display: inline-block; margin: 25px 0 15px 0; }
        p { line-height: 1.6; color: rgba(255, 255, 255, 0.8); font-size: 14px; margin: 0 0 10px 0; }

        .example-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .example-box pre { background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: 8px; font-size: 13px; color: #00ffcc; border: 1px solid var(--glass-border); margin: 5px 0; }

        /* 상단 선택바 */
        .selector-bar { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; }
        select { background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 6px; cursor: pointer; outline: none; }

        textarea#code-editor {
            flex-grow: 1; background: var(--editor-bg); color: #d4d4d4;
            border: 1px solid #333; border-radius: 8px; padding: 20px;
            font-family: 'Fira Code', monospace; font-size: 14px;
            resize: none; outline: none; line-height: 1.5;
        }

        .button-group { margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end; }
        .btn { padding: 10px 25px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-reset { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .btn-submit { background: var(--boj-blue); color: #fff; }

        /* 결과창 */
        .result-header { font-size: 14px; font-weight: 600; color: var(--text-sub); margin-bottom: 10px; display: flex; justify-content: space-between; }
        #result-display { flex-grow: 1; font-family: 'Fira Code', monospace; font-size: 13px; color: #bbb; overflow-y: auto; white-space: pre-wrap; }
        .status-running { color: #ffcc00; }
        .status-success { color: #28a745; font-weight: bold; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>

<body>

    <div class="container">
        <div class="problem-section" id="problem-content">
            </div>

        <div class="editor-section">
            <div class="editor-container">
                <div class="selector-bar">
                    <div style="flex-grow:1">
                        <span style="font-size: 13px; color: var(--text-sub);">문제 선택: </span>
                        <select id="problem-select" onchange="updateProblem()">
                            <option value="aplusb">1000번: A+B</option>
                            <option value="maxval">2562번: 최댓값</option>
                            <option value="prime">1978번: 소수 찾기</option>
                        </select>
                    </div>
                    <div>
                        <select id="language">
                            <option>Java</option>
                            <option>Python</option>
                            <option>C++</option>
                        </select>
                    </div>
                </div>

                <textarea id="code-editor" spellcheck="false"></textarea>

                <div class="button-group">
                    <button class="btn btn-reset" onclick="resetCode()">초기화</button>
                    <button class="btn btn-submit" onclick="submitCode()">제출하기</button>
                </div>
            </div>

            <div class="result-container">
                <div class="result-header">
                    <span>실행 결과</span>
                    <span id="judging-status">대기 중</span>
                </div>
                <div id="result-display">코드를 제출하면 채점 결과가 여기에 표시됩니다.</div>
            </div>
        </div>
    </div>

    <script>
        const problems = {
            aplusb: {
                title: "1000번: A+B",
                time: "2 초", memory: "128 MB", ratio: "39.4%",
                desc: "두 정수 A와 B를 입력받은 다음, A+B를 출력하는 프로그램을 작성하시오.",
                input: "첫째 줄에 A와 B가 주어진다. (0 < A, B < 10)",
                output: "첫째 줄에 A+B를 출력한다.",
                ex_in: "1 2", ex_out: "3",
                template: "import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int a = sc.nextInt();\n        int b = sc.nextInt();\n        System.out.println(a + b);\n    }\n}"
            },
            maxval: {
                title: "2562번: 최댓값",
                time: "1 초", memory: "128 MB", ratio: "45.2%",
                desc: "9개의 서로 다른 자연수가 주어질 때, 이들 중 최댓값을 찾고 그 최댓값이 몇 번째 수인지를 구하는 프로그램을 작성하시오.",
                input: "첫째 줄부터 아홉 번째 줄까지 한 줄에 하나의 자연수가 주어진다. 주어지는 자연수는 100 보다 작다.",
                output: "첫째 줄에 최댓값을 출력하고, 둘째 줄에 최댓값이 몇 번째 수인지를 출력한다.",
                ex_in: "3\n29\n38\n12\n57\n74\n40\n85\n61", ex_out: "85\n8",
                template: "import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.示);\n        // 최댓값 로직을 구현하세요\n    }\n}"
            },
            prime: {
                title: "1978번: 소수 찾기",
                time: "2 초", memory: "128 MB", ratio: "47.1%",
                desc: "주어진 수 N개 중에서 소수가 몇 개인지 찾아서 출력하는 프로그램을 작성하시오.",
                input: "첫째 줄에 수의 개수 N이 주어진다. N은 100이하이다. 다음으로 N개의 수가 주어지는데 수는 1,000 이하의 자연수이다.",
                output: "주어진 수들 중 소수의 개수를 출력한다.",
                ex_in: "4\n1 3 5 7", ex_out: "3",
                template: "import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        // 소수 찾기 로직을 구현하세요\n    }\n}"
            }
        };

        function updateProblem() {
            const selected = document.getElementById('problem-select').value;
            const data = problems[selected];
            
            const html = `
                <h1 class="title">${data.title}</h1>
                <table class="info-table">
                    <thead><tr><th>시간 제한</th><th>메모리 제한</th><th>정답 비율</th></tr></thead>
                    <tbody><tr><td>${data.time}</td><td>${data.memory}</td><td>${data.ratio}</td></tr></tbody>
                </table>
                <section><h3>문제</h3><p>${data.desc}</p></section>
                <section><h3>입력</h3><p>${data.input}</p></section>
                <section><h3>출력</h3><p>${data.output}</p></section>
                <div class="example-grid">
                    <div class="example-box"><p>예제 입력 1</p><pre>${data.ex_in}</pre></div>
                    <div class="example-box"><p>예제 출력 1</p><pre>${data.ex_out}</pre></div>
                </div>
            `;
            document.getElementById('problem-content').innerHTML = html;
            document.getElementById('code-editor').value = data.template;
            
            // 결과창 초기화
            document.getElementById('result-display').innerText = "코드를 제출하면 채점 결과가 여기에 표시됩니다.";
            document.getElementById('judging-status').innerText = "대기 중";
            document.getElementById('judging-status').className = "";
        }

        function submitCode() {
            const status = document.getElementById('judging-status');
            const display = document.getElementById('result-display');
            
            status.innerText = "채점 중...";
            status.className = "status-running";
            display.innerText = "> 컴파일 중...\n> 테스트 케이스 실행 중...";

            setTimeout(() => {
                status.innerText = "맞았습니다!!";
                status.className = "status-success";
                display.innerHTML = `<span class="status-success">정답입니다!</span>\n\n[결과 요약]\n- 시간: 104ms\n- 메모리: 14220KB\n- 언어: Java`;
            }, 1500);
        }

        function resetCode() {
            if(confirm("코드를 초기화하시겠습니까?")) {
                const selected = document.getElementById('problem-select').value;
                document.getElementById('code-editor').value = problems[selected].template;
            }
        }

        // 초기 실행
        updateProblem();
    </script>
</body>
</html>
